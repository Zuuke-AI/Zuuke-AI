<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="12" fill="#000"/>
  <defs>
    <filter id="neon" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="4"   result="b2"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="9"   result="b3"/>
      <feMerge>
        <feMergeNode in="b3"/>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#neon)" stroke="#00d4ff" fill="none"
     stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2">
    <!-- 4 parallel Z paths, outermost → innermost -->
    <path d="M 8,16 L 73,16 L 79,8  L 87,16 L 14,84 L 92,84"/>
    <path d="M 14,22 L 68,22 L 74,14 L 82,22 L 20,78 L 86,78"/>
    <path d="M 20,28 L 63,28 L 69,20 L 77,28 L 26,72 L 80,72"/>
    <path d="M 26,34 L 58,34 L 64,26 L 72,34 L 32,66 L 74,66"/>
  </g>
</svg>
